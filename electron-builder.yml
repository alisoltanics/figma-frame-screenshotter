appId: com.figmaframescreenshotter.app
productName: Figma Frame Screenshotter
artifactName: figma-frame-screenshotter-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - cli.js
  - preload.js
  - index.html
  - package.json
  - assets/**
  - .claude/**
asar: true
publish:
  provider: github
  releaseType: release
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Graphics
  icon: assets/icon.png
  executableName: figma-frame-screenshotter
  syncDesktopName: true
  maintainer: Figma Frame Screenshotter <noreply@example.com>
  synopsis: Capture Figma frames as PNG files
  description: Capture Figma frames as PNG files, including long frames split into tiles.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Figma Frame Screenshotter
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.graphics-design
  icon: assets/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
